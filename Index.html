<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PIXEL FOOD</title>

<style>

/* =====================================================
   CORES PRINCIPAIS
   MARROM DO BIFE + BEGE
===================================================== */

:root {
    --marrom-escuro: #35180d;
    --marrom: #66351f;
    --marrom-medio: #8b4f32;
    --marrom-claro: #b47755;

    --bege: #f3dfb5;
    --bege-claro: #faefd5;
    --bege-escuro: #dfc28e;

    --preto: #21120b;
    --verde: #557a43;
    --vermelho: #9d3b2e;
}


/* =====================================================
   CONFIGURAÇÕES
===================================================== */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: "Courier New", monospace;

    background:
        linear-gradient(
            45deg,
            rgba(80,40,20,.12) 25%,
            transparent 25%
        ),
        linear-gradient(
            -45deg,
            rgba(80,40,20,.12) 25%,
            transparent 25%
        ),
        var(--bege);

    background-size: 24px 24px;

    color: var(--marrom-escuro);

    min-height: 100vh;
}


/* =====================================================
   TELA DE ENTRADA
===================================================== */

.intro-screen {

    position: fixed;

    inset: 0;

    z-index: 9999;

    display: flex;

    justify-content: center;

    align-items: center;

    background:
        radial-gradient(
            circle,
            var(--bege-claro) 0%,
            var(--bege) 45%,
            var(--marrom-claro) 100%
        );

    overflow: hidden;
}


/* textura pixel */

.intro-screen::before {

    content: "";

    position: absolute;

    inset: 0;

    background-image:
        linear-gradient(
            rgba(80,40,20,.08) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(80,40,20,.08) 1px,
            transparent 1px
        );

    background-size: 28px 28px;
}


.intro-content {

    position: relative;

    display: flex;

    flex-direction: column;

    align-items: center;

    text-align: center;
}


/* =====================================================
   LOGO DA TELA INICIAL
===================================================== */

.intro-title {

    font-size: clamp(
        35px,
        8vw,
        65px
    );

    font-weight: 900;

    letter-spacing: 5px;

    color: var(--marrom);

    text-shadow:
        4px 4px 0 var(--bege-claro),
        7px 7px 0 var(--marrom-escuro);

    margin-bottom: 15px;

    animation:
        titleFloat
        2s
        ease-in-out
        infinite;
}


@keyframes titleFloat {

    0%,100% {
        transform:
            translateY(0);
    }

    50% {
        transform:
            translateY(-6px);
    }

}


/* =====================================================
   BIFE
===================================================== */

.steak-container {

    position: relative;

    width: 280px;

    height: 260px;

    display: flex;

    justify-content: center;

    align-items: center;

    margin-bottom: 20px;
}


/* imagem enviada */

.steak {

    width: 230px;

    height: 210px;

    object-fit: contain;

    image-rendering: pixelated;

    filter:
        drop-shadow(
            8px 8px 0
            rgba(40,20,10,.75)
        );

    user-select: none;

    animation:
        steakAnimation
        2s
        ease-in-out
        infinite;
}


@keyframes steakAnimation {

    0%,100% {

        transform:
            translateY(0)
            rotate(-3deg)
            scale(1);

    }

    25% {

        transform:
            translateY(-13px)
            rotate(3deg)
            scale(1.05);

    }

    50% {

        transform:
            translateY(0)
            rotate(4deg)
            scale(1);

    }

    75% {

        transform:
            translateY(-8px)
            rotate(-3deg)
            scale(1.05);

    }

}


/* sombra */

.steak-shadow {

    position: absolute;

    bottom: 10px;

    width: 135px;

    height: 22px;

    background:
        var(--marrom-escuro);

    border-radius: 50%;

    opacity: .5;

    animation:
        shadowAnimation
        2s
        ease-in-out
        infinite;
}


@keyframes shadowAnimation {

    0%,100% {

        transform:
            scale(1);

        opacity: .5;
    }

    50% {

        transform:
            scale(.7);

        opacity: .25;
    }

}


/* =====================================================
   BOTÃO ENTRAR
===================================================== */

.enter-button {

    background:
        var(--marrom);

    color:
        var(--bege-claro);

    border:
        5px solid
        var(--marrom-escuro);

    padding:
        18px 28px;

    font-family:
        "Courier New",
        monospace;

    font-size:
        17px;

    font-weight:
        900;

    cursor:
        pointer;

    box-shadow:
        7px 7px 0
        var(--marrom-escuro);

    transition:
        .15s;
}


.enter-button:hover {

    background:
        var(--marrom-medio);

    transform:
        scale(1.04);
}


.enter-button:active {

    transform:
        translate(
            7px,
            7px
        );

    box-shadow:
        none;
}


/* saída */

.intro-screen.hide {

    animation:
        introExit
        .7s
        forwards;
}


@keyframes introExit {

    from {

        opacity:
            1;

        transform:
            scale(1);
    }

    to {

        opacity:
            0;

        transform:
            scale(1.12);

        visibility:
            hidden;
    }
}


/* =====================================================
   APLICATIVO
===================================================== */

.app {

    width:
        100%;

    max-width:
        1100px;

    min-height:
        100vh;

    margin:
        auto;

    background:
        var(--bege);

    border-left:
        6px solid
        var(--marrom-escuro);

    border-right:
        6px solid
        var(--marrom-escuro);
}


/* =====================================================
   CABEÇALHO
===================================================== */

header {

    background:
        var(--marrom);

    color:
        var(--bege-claro);

    border-bottom:
        6px solid
        var(--marrom-escuro);

    padding:
        18px;

    display:
        flex;

    align-items:
        center;

    justify-content:
        space-between;

    box-shadow:
        0 6px 0
        var(--marrom-escuro);
}


.logo {

    font-size:
        28px;

    font-weight:
        900;

    letter-spacing:
        3px;

    text-shadow:
        3px 3px 0
        var(--marrom-escuro);
}


.cart-button {

    background:
        var(--bege);

    color:
        var(--marrom-escuro);

    border:
        4px solid
        var(--marrom-escuro);

    padding:
        10px 15px;

    cursor:
        pointer;

    font-family:
        inherit;

    font-weight:
        bold;

    box-shadow:
        4px 4px 0
        var(--marrom-escuro);
}


.cart-button:active {

    transform:
        translate(
            4px,
            4px
        );

    box-shadow:
        none;
}


#cartCount {

    background:
        var(--vermelho);

    color:
        white;

    padding:
        3px 7px;

    border:
        2px solid
        var(--marrom-escuro);
}


/* =====================================================
   TELAS
===================================================== */

.screen {

    display:
        none;

    padding:
        25px;
}


.screen.active {

    display:
        block;
}


/* =====================================================
   TÍTULOS
===================================================== */

.title {

    font-size:
        25px;

    margin-bottom:
        20px;

    color:
        var(--marrom);

    text-shadow:
        2px 2px 0
        var(--bege-claro);
}


.subtitle {

    color:
        #765b45;

    margin-bottom:
        20px;
}


/* =====================================================
   CATEGORIAS
===================================================== */

.categories {

    display:
        flex;

    gap:
        10px;

    flex-wrap:
        wrap;

    margin-bottom:
        25px;
}


.category {

    background:
        var(--bege-escuro);

    color:
        var(--marrom-escuro);

    border:
        4px solid
        var(--marrom-escuro);

    padding:
        12px 18px;

    font-family:
        inherit;

    font-weight:
        bold;

    cursor:
        pointer;

    box-shadow:
        4px 4px 0
        var(--marrom-escuro);
}


.category:hover {

    background:
        var(--bege-claro);
}


.category.selected {

    background:
        var(--marrom);

    color:
        var(--bege-claro);
}


.category:active {

    transform:
        translate(
            4px,
            4px
        );

    box-shadow:
        none;
}


/* =====================================================
   OFERTAS
===================================================== */

.offers {

    display:
        grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(
                220px,
                1fr
            )
        );

    gap:
        20px;
}


.offer {

    background:
        var(--bege-claro);

    border:
        5px solid
        var(--marrom-escuro);

    padding:
        15px;

    box-shadow:
        7px 7px 0
        var(--marrom-escuro);
}


.offer-image {

    height:
        130px;

    background:
        var(--bege-escuro);

    border:
        4px solid
        var(--marrom-escuro);

    display:
        flex;

    justify-content:
        center;

    align-items:
        center;

    font-size:
        55px;

    margin-bottom:
        15px;
}


.offer h3 {

    color:
        var(--marrom);

    margin-bottom:
        8px;
}


.price {

    font-size:
        20px;

    font-weight:
        bold;

    color:
        var(--verde);

    margin:
        10px 0;
}


/* =====================================================
   BOTÕES
===================================================== */

.btn {

    background:
        var(--marrom);

    color:
        var(--bege-claro);

    border:
        4px solid
        var(--marrom-escuro);

    padding:
        12px 18px;

    font-family:
        inherit;

    font-weight:
        bold;

    cursor:
        pointer;

    box-shadow:
        5px 5px 0
        var(--marrom-escuro);

    margin:
        5px;
}


.btn:hover {

    background:
        var(--marrom-medio);
}


.btn:active {

    transform:
        translate(
            5px,
            5px
        );

    box-shadow:
        none;
}


.btn.green {

    background:
        var(--verde);
}


.btn.blue {

    background:
        #80644c;
}


.btn:disabled {

    opacity:
        .4;

    cursor:
        not-allowed;
}


/* =====================================================
   LIVRO DO CARDÁPIO
===================================================== */

.book {

    width:
        100%;

    display:
        grid;

    grid-template-columns:
        1fr 1fr;

    background:
        var(--marrom);

    border:
        8px solid
        var(--marrom-escuro);

    box-shadow:
        10px 10px 0
        var(--marrom-escuro);

    min-height:
        480px;
}


.page {

    background:
        repeating-linear-gradient(
            0deg,
            var(--bege) 0,
            var(--bege) 3px,
            #ead4a8 3px,
            #ead4a8 6px
        );

    color:
        var(--marrom-escuro);

    padding:
        25px;

    border:
        4px solid
        #4a2817;
}


.page.left {

    border-right:
        5px solid
        #4a2817;
}


.page.right {

    border-left:
        5px solid
        #9b704e;
}


.page-title {

    text-align:
        center;

    font-size:
        20px;

    border-bottom:
        4px double
        #4a2817;

    padding-bottom:
        12px;

    margin-bottom:
        15px;
}


.product {

    background:
        var(--bege-claro);

    border:
        4px solid
        #4a2817;

    padding:
        12px;

    margin-bottom:
        12px;

    cursor:
        pointer;

    box-shadow:
        4px 4px 0
        var(--marrom);

    transition:
        .1s;
}


.product:hover {

    background:
        #fff4d7;

    transform:
        translate(
            -2px,
            -2px
        );
}


.product h3 {

    font-size:
        16px;

    margin-bottom:
        7px;
}


.product-info {

    display:
        flex;

    justify-content:
        space-between;

    align-items:
        center;
}


.product-price {

    font-weight:
        bold;

    color:
        var(--verde);
}


.product-icon {

    font-size:
        30px;

    float:
        right;
}


.page-controls {

    display:
        flex;

    justify-content:
        center;

    align-items:
        center;

    gap:
        15px;

    margin-top:
        25px;
}


.page-number {

    background:
        var(--marrom-escuro);

    color:
        var(--bege-claro);

    padding:
        12px 18px;

    border:
        4px solid
        var(--marrom-claro);
}


/* =====================================================
   CARRINHO
===================================================== */

.cart-list {

    margin-bottom:
        20px;
}


.cart-item {

    display:
        flex;

    justify-content:
        space-between;

    align-items:
        center;

    background:
        var(--bege-claro);

    border:
        4px solid
        var(--marrom-escuro);

    padding:
        15px;

    margin-bottom:
        12px;
}


.cart-item-info h3 {

    color:
        var(--marrom);

    margin-bottom:
        5px;
}


.remove-btn {

    background:
        var(--vermelho);

    color:
        white;

    border:
        3px solid
        var(--marrom-escuro);

    padding:
        8px;

    cursor:
        pointer;

    font-family:
        inherit;

    font-weight:
        bold;
}


.cart-total {

    background:
        var(--marrom-escuro);

    color:
        var(--bege-claro);

    border:
        5px solid
        var(--marrom-claro);

    padding:
        20px;

    font-size:
        22px;

    margin:
        20px 0;

    text-align:
        right;
}


.empty {

    text-align:
        center;

    padding:
        50px 20px;

    color:
        #765b45;

    border:
        4px dashed
        #9b7657;
}


/* =====================================================
   PAGAMENTO
===================================================== */

.payment-box {

    max-width:
        700px;

    margin:
        auto;

    background:
        var(--bege-claro);

    border:
        5px solid
        var(--marrom-escuro);

    padding:
        25px;

    box-shadow:
        8px 8px 0
        var(--marrom-escuro);
}


.payment-options {

    display:
        grid;

    grid-template-columns:
        repeat(
            3,
            1fr
        );

    gap:
        12px;

    margin:
        20px 0;
}


.payment-option {

    background:
        var(--bege-escuro);

    border:
        4px solid
        var(--marrom-escuro);

    padding:
        20px 10px;

    text-align:
        center;

    cursor:
        pointer;

    font-family:
        inherit;

    color:
        var(--marrom-escuro);

    font-weight:
        bold;
}


.payment-option.selected {

    background:
        var(--marrom);

    color:
        var(--bege-claro);
}


.payment-details {

    background:
        var(--marrom-escuro);

    color:
        var(--bege-claro);

    border:
        4px solid
        var(--marrom-escuro);

    padding:
        20px;

    margin-bottom:
        20px;
}


.payment-details input {

    width:
        100%;

    background:
        var(--bege-claro);

    border:
        3px solid
        var(--marrom-escuro);

    color:
        var(--marrom-escuro);

    padding:
        12px;

    margin-top:
        10px;

    font-family:
        inherit;
}


.pix-code {

    background:
        #fff4d8;

    color:
        var(--marrom-escuro);

    padding:
        15px;

    word-break:
        break-all;

    border:
        4px solid
        var(--marrom-escuro);

    margin-top:
        10px;
}


/* =====================================================
   NOTIFICAÇÃO
===================================================== */

.toast {

    position:
        fixed;

    bottom:
        25px;

    right:
        25px;

    background:
        var(--marrom-escuro);

    color:
        var(--bege-claro);

    border:
        4px solid
        var(--marrom-claro);

    padding:
        15px 20px;

    box-shadow:
        5px 5px 0
        #1b0c05;

    transform:
        translateY(150px);

    transition:
        .3s;

    z-index:
        10000;
}


.toast.show {

    transform:
        translateY(0);
}


/* =====================================================
   RODAPÉ
===================================================== */

footer {

    text-align:
        center;

    color:
        #80644c;

    padding:
        30px 10px;

    border-top:
        4px solid
        #6b452d;

    margin-top:
        30px;
}


/* =====================================================
   CELULAR
===================================================== */

@media (max-width:650px) {

    .logo {
        font-size:
            19px;
    }

    .screen {
        padding:
            15px;
    }

    .book {
        min-height:
            400px;
    }

    .page {
        padding:
            12px;
    }

    .page-title {
        font-size:
            15px;
    }

    .product {
        padding:
            8px;
    }

    .product h3 {
        font-size:
            13px;
    }

    .product-icon {
        font-size:
            22px;
    }

    .payment-options {
        grid-template-columns:
            1fr;
    }

    .cart-item {
        gap:
            10px;
    }

    .intro-title {
        font-size:
            35px;
    }

    .steak {
        width:
            190px;

        height:
            175px;
    }

    .steak-container {
        width:
            220px;

        height:
            205px;
    }

    .enter-button {
        font-size:
            14px;

        padding:
            15px 18px;
    }

}

</style>
</head>


<body>


<!-- =====================================================
     TELA DE ENTRADA
===================================================== -->

<div
    id="introScreen"
    class="intro-screen">

    <div class="intro-content">

        <div class="intro-title">
            PIXEL FOOD
        </div>


        <div class="steak-container">

            <!-- COLOQUE A IMAGEM DO BIFE COMO "bife.jpg" -->

            <img
                class="steak"
                src="bife.jpg"
                alt="Bife Pixel">

            <div class="steak-shadow"></div>

        </div>


        <button
            class="enter-button"
            onclick="enterApp()">

            ▶ ENTRAR NO APLICATIVO

        </button>

    </div>

</div>


<!-- =====================================================
     APLICATIVO ORIGINAL
===================================================== -->

<div class="app">


<header>

    <div class="logo">
        PIXEL FOOD
    </div>


    <button
        class="cart-button"
        onclick="showScreen('cart')">

        🛒 PEDIDOS

        <span id="cartCount">
            0
        </span>

    </button>

</header>


<!-- =====================================================
     HOME
===================================================== -->

<section
    id="home"
    class="screen active">

    <h1 class="title">
        ⚔️ TAVERNA PIXEL FOOD
    </h1>


    <p class="subtitle">
        Escolha uma categoria e confira nosso cardápio.
    </p>


    <div class="categories">

        <button
            class="cat
